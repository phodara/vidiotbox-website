  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee; font-family: Arial, Helvetica, sans-serif; }
    .stage { position: fixed; inset: 0; overflow: hidden; }
    .disc { position: absolute; top: 0; left: 0; object-fit: contain; clip-path: circle(47.4%); will-change: transform; user-select: none; touch-action: none; cursor: grab; -webkit-user-drag: none; }
    .disc[data-dragging="true"] { cursor: grabbing; z-index: 10; }
  .site-menu {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .menu-toggle {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: #101010;
    border: 1px solid #00E5FF;
    color: #7dd3fc;
    box-shadow: 0 0 0 1px rgba(0, 229, 255, .2);

  .menu-toggle:hover,
  .menu-toggle:focus {

  .menu-toggle span,
  .menu-toggle::before,
  .menu-toggle::after {

  .menu-toggle::before {

  }
  .menu-toggle::after {
    transform: translateY(6px);

  .site-menu[data-open="true"] .menu-toggle span {
    opacity: 0;
  }
  .site-menu[data-open="true"] .menu-toggle::before {
    transform: translateY(2px) rotate(45deg);
  }
  .site-menu[data-open="true"] .menu-toggle::after {
    transform: translateY(-2px) rotate(-45deg);
  }

    position: absolute;
    top: 54px;
    left: 0;
    width: min(260px, calc(100vw - 28px));
    display: none;
    padding: 10px;
    background: #101010;
    border: 1px solid #00E5FF;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .45);

<body>
  <main class="stage" aria-label="Animated prohibition pictograms">
    <h1 class="sr-only">Vidiotbox pictograms</h1>
  </main>
  <script src="assets/site-menu.js"></script>
  <noscript><p>Enable JavaScript to see the animated pictograms.</p></noscript>
  <script>
  (() => {
    const files = [
      ['assets/pictograms/web/BabyDrivingCropped.png', 'Do not let babies drive'],
      ['assets/pictograms/web/DoNotCarInholeCropped.png', 'Do not drive into a hole'],
      ['assets/pictograms/web/DoNotClownOnUnicycleCropped.png', 'No clowns on unicycles'],
      ['assets/pictograms/web/DoNotCowSaucerCropped.png', 'No cows in flying saucers'],
      ['assets/pictograms/web/DoNotEjectionSeatCropped.png', 'Do not use the ejection seat'],
      ['assets/pictograms/web/DoNotPickNoseCropped.png', 'Do not pick your nose'],
      ['assets/pictograms/web/DogInMicrowaveCropped.png', 'Do not put dogs in microwaves'],
      ['assets/pictograms/web/FootInMouth_Cropped.png', 'Do not put your foot in your mouth'],
      ['assets/pictograms/web/NoHeadInToilet_Cropped.png', 'Do not put your head in the toilet'],
      ['assets/pictograms/web/NoSleeping on tracksCropped.png', 'Do not sleep on the tracks'],
      ['assets/pictograms/web/StepInShit_Cropped.png', 'Do not step in poop']
    ];
    const stage = document.querySelector('.stage');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reducedMotion.matches;
    let width = innerWidth, height = innerHeight, previous = 0, frame = 0;
    const discs = files.map(([file, label], i) => {
      const image = new Image();
      image.className = 'disc';
      image.src = encodeURI(file);
      image.alt = label;
      image.draggable = false;
      stage.appendChild(image);
      const direction = Math.random() * Math.PI * 2;
      const speed = 45 + Math.random() * 45;
      return { image, x: 0, y: 0, radius: 0, vx: Math.cos(direction) * speed,
        vy: Math.sin(direction) * speed, angle: (Math.random() - .5) * 24,
        spin: (Math.random() - .5) * 14, scale: (.82 + (i % 4) * .12) * 1.2 };
    });
    // Pointer capture keeps the selected sign attached even outside its bounds.
    for (const d of discs) {
      d.pointerId = null;
      d.image.addEventListener('pointerdown', event => {
        if (event.button !== 0 || d.pointerId !== null) return;
        event.preventDefault();
        d.pointerId = event.pointerId;
        d.offsetX = event.clientX - d.x;
        d.offsetY = event.clientY - d.y;
        d.image.dataset.dragging = 'true';
        d.image.setPointerCapture(event.pointerId);
      });
      d.image.addEventListener('pointermove', event => {
        if (event.pointerId !== d.pointerId) return;
        d.x = event.clientX - d.offsetX;
        d.y = event.clientY - d.offsetY;
        paint();
      });
      function release(event) {
        if (event.pointerId !== d.pointerId) return;
        d.pointerId = null;
        delete d.image.dataset.dragging;
        if (d.image.hasPointerCapture(event.pointerId)) {
          d.image.releasePointerCapture(event.pointerId);
        }
      }
      d.image.addEventListener('pointerup', release);
      d.image.addEventListener('pointercancel', release);
      d.image.addEventListener('lostpointercapture', release);
    }
    function paint() {
      for (const d of discs) {
        d.image.style.transform = `translate3d(${d.x - d.radius}px, ${d.y - d.radius}px, 0) rotate(${d.angle}deg)`;
      }
    }
    function resize() {
      width = innerWidth; height = innerHeight;
      const columns = width > height ? 4 : 3;
      const rows = Math.ceil(discs.length / columns);
      const size = Math.min(230, width / columns * .78, height / rows * .78);
      discs.forEach((d, i) => {
        d.radius = size * d.scale / 2;
        d.image.style.width = d.image.style.height = d.radius * 2 + 'px';
        d.x = (i % columns + .5) * width / columns;
        d.y = (Math.floor(i / columns) + .5) * height / rows;
      });
      paint();
    }
    function tick(now) {
      frame = 0;
      if (paused || document.hidden) return;
      const dt = previous ? Math.min((now - previous) / 1000, .035) : 0;
      previous = now;
      for (const d of discs) {
        if (d.pointerId !== null) continue;
        d.x += d.vx * dt; d.y += d.vy * dt; d.angle += d.spin * dt;
        // Wrap fully hidden signs to the opposite edge, preserving their motion.
        const margin = d.radius;
        const wrapWidth = width + margin * 2, wrapHeight = height + margin * 2;
        d.x = ((d.x + margin) % wrapWidth + wrapWidth) % wrapWidth - margin;
        d.y = ((d.y + margin) % wrapHeight + wrapHeight) % wrapHeight - margin;
      }
      for (let i = 0; i < discs.length; i++) {
        for (let j = i + 1; j < discs.length; j++) {
          const a = discs[i], b = discs[j];
          if (a.pointerId !== null || b.pointerId !== null) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const distance = Math.hypot(dx, dy);
          const separation = (a.radius + b.radius) * .948;
          if (!distance || distance >= separation) continue;
          const nx = dx / distance, ny = dy / distance;
          const overlap = (separation - distance) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          const approach = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (approach > 0) {
            a.vx -= approach * nx; a.vy -= approach * ny;
            b.vx += approach * nx; b.vy += approach * ny;
            a.spin *= -1; b.spin *= -1;
          }
        }
      }
      paint();
      frame = requestAnimationFrame(tick);
    }
    function syncPlayback() {
      cancelAnimationFrame(frame); previous = 0;
      if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
    }
    reducedMotion.addEventListener('change', () => { paused = reducedMotion.matches; resize(); syncPlayback(); });
    document.addEventListener('visibilitychange', syncPlayback);
    addEventListener('resize', resize);
    resize(); syncPlayback();
  })();
  </script>
</body>
</html>
