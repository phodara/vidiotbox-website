<style>
:root {
    --peach: #ffc6ad;
    --yellow: #f2db45;
    --navy: #081a27;
    --red: #ed2f31;
    --slate: #455b69;
    --panel: rgba(255, 255, 255, .38);
    --rule: rgba(8, 26, 39, .12);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--yellow);
    color: var(--navy);
    font-family: "Cabin", Arial, Helvetica, sans-serif;
}

a { color: inherit; text-decoration: none; }

.hero {
    height: 170px;
    background: var(--peach);
    border-bottom: 3px solid var(--red);
}

.card {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 18px 32px;
    text-align: center;
}

.portrait {
    display: block;
    width: 128px;
    height: 128px;
    margin: -64px auto 0;
    border-radius: 50%;
    border: 4px solid var(--navy);
    object-fit: cover;
    object-position: center;
    background: var(--peach);
    position: relative;
}

.createdby {
    margin-top: 14px;
    color: var(--red);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    margin: 4px 0 20px;
    font-family: "Gill Sans", "Gill Sans MT", "Cabin", sans-serif;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -.5px;
    line-height: 1.1;
}

.cta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.cta a, .cta button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px 6px;
    border-radius: 6px;
    font: 700 13px/1 "Cabin", Arial, sans-serif;
    letter-spacing: .4px;
    text-transform: uppercase;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}

.cta .primary {
    background: var(--red);
    color: #fff;
    border: 2px solid var(--red);
}

.cta .primary:hover, .cta .primary:focus-visible { background: var(--navy); border-color: var(--navy); }

.cta .secondary {
    background: transparent;
    color: var(--navy);
    border: 2px solid var(--navy);
    appearance: none;
}

.cta .secondary:hover, .cta .secondary:focus-visible { background: var(--navy); color: var(--yellow); }

h2 {
    text-align: left;
    margin: 18px 2px 7px;
    color: var(--red);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.list {
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
    text-align: left;
}

.row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 11px 14px;
    font-size: 16px;
    font-weight: 600;
    border-top: 1px solid var(--rule);
    transition: background .15s ease;
}

.row:first-child { border-top: 0; }

.row:hover, .row:focus-visible { background: rgba(255, 255, 255, .55); outline: none; }

.ic {
    flex: none;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--navy);
    color: var(--yellow);
    font-size: 11px;
    font-weight: 700;
}

.sub {
    margin-left: auto;
    color: var(--slate);
    font-size: 12px;
    font-weight: 400;
    white-space: nowrap;
}

.email-note {
    margin: -12px 0 18px;
    color: var(--navy);
    font-size: 14px;
    font-weight: 600;
    user-select: all;
}

@media (max-width: 380px) {
    h1 { font-size: 32px; }
    .sub { display: none; }
}
</style>

<body>

<header class="hero" aria-hidden="true"></header>

<main class="card">
    <img class="portrait" src="paul-portrait.jpg" alt="Portrait of Paul Hodara" width="128" height="128">

    <div class="createdby">Created by</div>
    <h1>Paul Hodara</h1>

    <div class="cta">
        <a class="primary" href="paul-hodara.vcf" download>Add to Contacts</a>
        <a class="secondary" id="emailButton" href="#">Email</a>
    </div>
    <div class="email-note" id="emailNote" hidden></div>

    <h2>Elsewhere</h2>
    <nav class="list" aria-label="Elsewhere">
        <a class="row" href="https://github.com/phodara"><span class="ic">GH</span>GitHub<span class="sub">phodara</span></a>
        <a class="row" href="https://haiku-matic.com/"><span class="ic">HM</span>hAIku-Matic<span class="sub">haiku-matic.com</span></a>
        <a class="row" href="https://www.instagram.com/phodara"><span class="ic">IG</span>Instagram<span class="sub">@phodara</span></a>
        <a class="row" href="https://www.linkedin.com/in/paulhodara/"><span class="ic">in</span>LinkedIn<span class="sub">paulhodara</span></a>
        <a class="row" href="https://www.thelivingmuseum.org"><span class="ic">LM</span>The Living Museum<span class="sub">thelivingmuseum.org</span></a>
        <a class="row" href="https://netwave.com/"><span class="ic">NW</span>NetWave Technologies<span class="sub">netwave.com</span></a>
        <a class="row" href="https://www.paulhodara.com"><span class="ic">PH</span>Photography<span class="sub">paulhodara.com</span></a>
        <a class="row" href="https://www.vidiotbox.net/"><span class="ic">VB</span>Vidiotbox<span class="sub">vidiotbox.net</span></a>
    </nav>

</main>

<script>
(function () {
    // Address is assembled here so it is not sitting in the HTML for scrapers.
    const user = ['p', 'h', 'o', 'd', 'a', 'r', 'a'].join('');
    const host = ['g', 'm', 'a', 'i', 'l'].join('') + '.' + ['c', 'o', 'm'].join('');
    const address = user + '@' + host;
    const button = document.getElementById('emailButton');
    const note = document.getElementById('emailNote');

    // A real mailto link works in more places than a script redirect
    // (in-app browsers and some mobile browsers block the latter).
    button.href = 'mailto:' + address;

    // Fallback for when no mail app is set up: show the address and copy it.
    button.addEventListener('click', function () {
        note.textContent = address;
        note.hidden = false;
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(address).then(function () {
                note.textContent = address + ' (copied)';
            }).catch(function () {});
        }
    });
})();
</script>

</body>
