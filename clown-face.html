<body>
  <main>
    <header>
      <div class="eyebrow">Faceimator / composed experiment</div>
      <h1>Clown face</h1>
    </header>
    <div class="layout">
      <section>
        <div class="card stage">
          <svg id="stage" viewBox="0 0 900 900" aria-label="Clown face assembled from mirrored vector hair and eyes with a smiling mouth">
            <defs id="assetDefs"></defs>
            <rect id="backgroundFill" width="900" height="900" fill="#ffffff"></rect>
            <g id="hairLeft"></g>
            <use id="hairRight" href="#hairLeft" transform="translate(900 0) scale(-1 1)"></use>
            <g id="features" opacity="0">
              <g id="eyeLeftFeature"><use href="#eyeArtwork"></use></g>
              <g id="eyeRightMirror"><g id="eyeRightFeature"><use href="#eyeArtworkRight"></use></g></g>
              <g id="browLeftFeature"><path id="browLeft" fill="none" stroke="#111" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"></path></g>
              <g id="browRightMirror"><g id="browRightFeature"><path id="browRight" fill="none" stroke="#111" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"></path></g></g>
              <g id="noseFeature"><circle cx="450" cy="475" r="58" fill="#ef3340" stroke="#111" stroke-width="7"></circle></g>
              <g id="mouthFeature"></g>
            </g>
            <text id="copyrightMark" x="882" y="878" text-anchor="end" fill="#000000" font-family="'Bradley Hand','Segoe Print','Comic Sans MS',cursive" font-size="36">Faceimator (c) 2026 Paul Hodara</text>
            <text id="loading" class="loading" x="450" y="450">Loading vector artwork...</text>
          </svg>
        </div>
      </section>
      <aside class="card" id="controlsPanel">
        <div class="controls">
        <div class="control-col">
        <small>01 / Hair pose</small>
        <div class="poses" id="poses"></div>
        <div class="control-block">
        <small>02 / Hair controls</small>
        <label class="parameter-label" for="hairLength">Length <output id="hairLengthValue">0</output></label>
        <input id="hairLength" type="range" min="0" max="60" step="1" value="0">
        <label class="parameter-label" for="hairWaviness">Waviness <output id="hairWavinessValue">1.0</output></label>
        <input id="hairWaviness" type="range" min="0" max="10" step="0.1" value="1">
        <label class="parameter-label" for="hairRotation">Rotation <output id="hairRotationValue">0 deg</output></label>
        <input id="hairRotation" type="range" min="-45" max="45" step="1" value="0">
        </div>
        <div class="control-block">
          <small>03 / Mouth pose</small>
          <div class="poses" id="mouthPoses"></div>
        </div>
        <div class="control-block">
          <small>04 / Eyebrow controls</small>
          <label class="parameter-label" for="browVertical">Vertical <output id="browVerticalValue">0 px</output></label>
          <input id="browVertical" type="range" min="-100" max="100" step="1" value="0">
          <label class="parameter-label" for="browCurve">Flat - curve <output id="browCurveValue">45%</output></label>
          <input id="browCurve" type="range" min="0" max="100" step="1" value="45">
          <label class="parameter-label" for="browTilt">Tilt <output id="browTiltValue">0 deg</output></label>
          <input id="browTilt" type="range" min="-30" max="30" step="1" value="0">
          <label class="parameter-label" for="wink">Wink <output id="winkValue">0.00</output></label>
          <input id="wink" type="range" min="-1" max="1" step="0.01" value="0">
        </div>
        </div>
        <div class="control-col">
        <div class="control-section">
          <small>05 / Eye controls</small>
          <label class="parameter-label" for="eyelidOpen">Open <output id="eyelidOpenValue">1.00</output></label>
          <input id="eyelidOpen" type="range" min="0.05" max="1.25" step="0.01" value="1">
          <label class="parameter-label" for="eyeTilt">Tilt <output id="eyeTiltValue">0.00</output></label>
          <input id="eyeTilt" type="range" min="-1.4" max="1.4" step="0.01" value="0">
          <label class="parameter-label" for="pupilSize">Pupil size <output id="pupilSizeValue">0.14</output></label>
          <input id="pupilSize" type="range" min="0.05" max="0.4" step="0.001" value="0.144">
          <label class="parameter-label" for="eyeballSize">Eyeball size <output id="eyeballSizeValue">1.00</output></label>
          <input id="eyeballSize" type="range" min="0.55" max="1.55" step="0.01" value="1">
          <label class="parameter-label" for="pupilOffsetX">Pupil X axis <output id="pupilOffsetXValue">0.00</output></label>
          <input id="pupilOffsetX" type="range" min="-0.2" max="0.2" step="0.005" value="0">
          <label class="parameter-label" for="pupilOffsetY">Pupil Y axis <output id="pupilOffsetYValue">0.00</output></label>
          <input id="pupilOffsetY" type="range" min="-0.12" max="0.12" step="0.005" value="0">
        </div>
        <div class="control-section" id="settingsPanel">
          <small>06 / Color settings</small>
          <div class="color-settings-grid">
            <label class="color-picker" for="lipColor" style="margin-top:14px"><span>Lip</span><input id="lipColor" type="color" value="#ffffff"></label>
            <label class="color-picker" for="pupilColor" style="margin-top:10px"><span>Retina</span><input id="pupilColor" type="color" value="#00a0bb"></label>
            <label class="color-picker" for="hairColor" style="margin-top:10px"><span>Hair</span><input id="hairColor" type="color" value="#111111"></label>
            <label class="color-picker" for="eyeArtworkColor" style="margin-top:10px"><span>Eye</span><input id="eyeArtworkColor" type="color" value="#111111"></label>
            <label class="color-picker" for="backgroundColor" style="margin-top:10px"><span>Background</span><input id="backgroundColor" type="color" value="#ffffff"></label>
          </div>
        </div>
        <div class="control-section loop-builder">
          <small>07 / Animation</small>
          <div class="loop-chain">
            <button id="addPose" type="button">Add pose</button>
            <button id="clearLoop" type="button">Clear poses</button>
            <div class="loop-dots" id="loopDots" aria-label="Loop positions"></div>
          </div>
          <label class="loop-repeats" for="previewRepeats">Repeats <input id="previewRepeats" type="number" min="1" max="20" step="1" value="3"></label>
          <div class="actions">
            <button id="previewLoop" type="button">Preview</button>
            <button id="stopPreview" type="button" disabled>Stop preview</button>
            <button id="export" type="button">Download SVG</button>
            <button id="shareGif" type="button">Share GIF</button>
          </div>
        </div>
        <div class="control-section">
          <div class="actions" style="margin-top:0">
            <button id="reset" type="button">Reset controls</button>
          </div>
          <p class="status" id="status" aria-live="polite"></p>
        </div>
        </div>
        </div>
      </aside>
    </div>
  </main>

    }

    function applyBrowControls(){
      const browPlacement=BROW_PART.placement;
      for(const [side,slot] of Object.entries(BROW_PART.sides)){
        const vertical=winked(side,'browVertical'),tilt=winked(side,'browTilt');
        $(slot.pathId).setAttribute('d',browRig.pathData(winked(side,'browCurve')));
        $(slot.featureId).setAttribute('transform',`translate(${browPlacement.x} ${(browPlacement.y-vertical*(vertical>0?browPlacement.raiseScale:browPlacement.lowerScale)).toFixed(3)}) rotate(${tilt}) scale(${browPlacement.scale}) translate(${-browRig.CENTER[0]} ${-browRig.CENTER[1]})`);
      }
      $('browVerticalValue').value=Math.round(+$('browVertical').value)+' px';$('browCurveValue').value=Math.round(+$('browCurve').value)+'%';$('browTiltValue').value=Math.round(+$('browTilt').value)+' deg';$('winkValue').value=(+$('wink').value).toFixed(2);
    }

    // Wink snarl, bent into the mouth at render time so poses, tweens and snapshots keep the plain shape.
    // Screen left: around the canine (SNARL_CENTER, -1..1 corner to corner) the upper lip edges lift SNARL_LIFT
    // and the lower edges drop SNARL_DROP, fading to nothing at the corner so the contour stays closed; the
    // wider opening clips less of the teeth. Screen right: every point sinks SNARL_DROOP·u² toward the corner.
    const {mid:MOUTH_MID,lift:SNARL_LIFT,drop:SNARL_DROP,droop:SNARL_DROOP,center:SNARL_CENTER,spread:SNARL_SPREAD,cornerFade:SNARL_CORNER_FADE}=MOUTH_PART.snarl;
    // A negative amount mirrors the snarl about the mouth centre (lift on screen right, droop on screen left).
    function snarled(p,amount){
      if(!amount)return p;
      const dir=Math.sign(amount);amount=Math.abs(amount);
      return Object.fromEntries(Object.entries(p).map(([k,pts])=>{

    }
    function renderMouth(){
      if(!mouthShape)return;
      $('mouthFeature').innerHTML=mouthRig.markup(snarled(mouthShape,+$('wink').value),true,$('lipColor').value);
    }

    // Blend from the displayed mouth to the chosen pose; every pose shares the lab's point correspondence.
    function selectMouthPose(name,animate=true){
      mouthPose=name;
      document.querySelectorAll('[data-mouth-pose]').forEach(button=>button.classList.toggle('active',button.dataset.mouthPose===name));
      const target=mouthRig.defaults[name];
      if(!mouthShape||!animate){mouthTween=null;mouthShape=structuredClone(target);renderMouth();return}
      const from=mouthShape,start=performance.now(),tween={};
      mouthTween=tween;
      const step=now=>{
        if(mouthTween!==tween)return;

        renderMouth();
        if(t<1)requestAnimationFrame(step);else mouthTween=null;
      };

    }

    // The GIF builder poses the hair wave per frame, so the live loop stands aside while it runs.
    function animateWave(now){
      if(!gifBuilding)setWave(now);
      waveFrame=requestAnimationFrame(animateWave);
    }

    function setWave(now){
      const amplitude=current.hairWaviness*HAIR_PART.wave.amplitudeScale/fitScale,phase=now*HAIR_PART.wave.phaseSpeed;
      waveSlices.forEach((slice,i)=>{
        const x=i/(HAIR_PART.wave.sliceCount-1),edge=Math.sin(Math.PI*x),dy=Math.sin(phase+x*Math.PI*HAIR_PART.wave.cycles)*amplitude*edge;
        slice.setAttribute('transform',`translate(0 ${dy.toFixed(3)})`);
      });
    }

    function selectPose(name){
      selected=name;
      document.querySelectorAll('[data-pose]').forEach(button=>button.classList.toggle('active',button.dataset.pose===name));
      applyHair(presets[name]);
    }

    for(const name of Object.keys(mouthRig.defaults)){
      const button=document.createElement('button');button.type='button';button.textContent=name;button.dataset.mouthPose=name;button.onclick=()=>selectMouthPose(name);$('mouthPoses').append(button);
    }
    for(const name of Object.keys(presets)){
      const button=document.createElement('button');button.type='button';button.textContent=name;button.dataset.pose=name;button.onclick=()=>selectPose(name);$('poses').append(button);
    }
    for(const id of ['hairLength','hairWaviness','hairRotation'])$(id).oninput=()=>{
      current={hairLength:+$('hairLength').value,hairWaviness:+$('hairWaviness').value,hairRotation:+$('hairRotation').value};
      presets[selected]={...current};
      applyHair(current);
    };
    for(const id of EYE_PART.controlKeys)$(id).oninput=applyEyeControls;
    for(const id of BROW_KEYS)$(id).oninput=applyBrowControls;
    $('wink').oninput=()=>{applyEyeControls();applyBrowControls();renderMouth()};
    $('reset').onclick=()=>{
      Object.assign(presets,{Original:{hairLength:0,hairWaviness:1,hairRotation:0},Long:{hairLength:60,hairWaviness:1,hairRotation:0},Wavy:{hairLength:32,hairWaviness:6,hairRotation:0},Wild:{hairLength:60,hairWaviness:10,hairRotation:0}});
      for(const [id,value] of Object.entries(featureDefaults))$(id).value=value;
      stopPreview();$('lipColor').value='#ffffff';$('pupilColor').value='#00a0bb';$('hairColor').value='#111111';applyHairColor();$('eyeArtworkColor').value='#111111';applyEyeArtworkColor();$('backgroundColor').value='#ffffff';applyBackgroundColor();
      selectPose('Original');applyEyeControls();applyBrowControls();selectMouthPose('Smile',false);
      $('status').textContent='All controls reset';setTimeout(()=>$('status').textContent='',1400);
    };
    // Animation loop, modelled on index.html: capture up to LOOP_LIMIT face snapshots, then preview them
    // in order with eased PHASE_MS transitions, wrapping back to the first pose, for the chosen repeats.
    const LOOP_LIMIT=10,PHASE_MS=900,EYE_KEYS=EYE_PART.controlKeys;
    const loopPoses=[];let preview=null;
    const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lerp=(a,b,t)=>a+(b-a)*t;
    // While a mouth pose is still tweening in, capture the pose it is heading to rather than the in-between shape.
    function snapshot(){return {hairPose:selected,hair:{...current},eyes:Object.fromEntries(EYE_KEYS.map(id=>[id,+$(id).value])),brows:Object.fromEntries(BROW_KEYS.map(id=>[id,+$(id).value])),mouthPose,mouth:structuredClone(mouthTween?mouthRig.defaults[mouthPose]:mouthShape),lipColor:$('lipColor').value,pupilColor:$('pupilColor').value,hairColor:$('hairColor').value,eyeArtworkColor:$('eyeArtworkColor').value}}
    function mixSnapshots(a,b,t){return {...a,hair:Object.fromEntries(Object.keys(a.hair).map(k=>[k,lerp(a.hair[k],b.hair[k],t)])),eyes:Object.fromEntries(EYE_KEYS.map(k=>[k,lerp(a.eyes[k],b.eyes[k],t)])),brows:Object.fromEntries(BROW_KEYS.map(k=>[k,lerp(a.brows[k],b.brows[k],t)])),mouth:mouthRig.blend(a.mouth,b.mouth,t),lipColor:mixHex(a.lipColor,b.lipColor,t),pupilColor:mixHex(a.pupilColor,b.pupilColor,t),hairColor:mixHex(a.hairColor,b.hairColor,t),eyeArtworkColor:mixHex(a.eyeArtworkColor,b.eyeArtworkColor,t)}}
    function mixHex(a,b,t){const ch=(h,i)=>parseInt(h.slice(1+i*2,3+i*2),16);return '#'+[0,1,2].map(i=>Math.round(lerp(ch(a,i),ch(b,i),t)).toString(16).padStart(2,'0')).join('')}
    function applySnapshot(snap){
      applyHair(snap.hair);
      $('hairColor').value=snap.hairColor;applyHairColor(snap.hairColor);
      $('eyeArtworkColor').value=snap.eyeArtworkColor;applyEyeArtworkColor(snap.eyeArtworkColor);
      for(const id of EYE_KEYS)$(id).value=snap.eyes[id];
      $('pupilColor').value=snap.pupilColor;
      for(const id of BROW_KEYS)$(id).value=snap.brows[id]??featureDefaults[id];applyEyeControls();applyBrowControls();
      $('lipColor').value=snap.lipColor;mouthTween=null;mouthShape=snap.mouth;renderMouth();
    }
    function flashLabel(button,label){const original=button.textContent;button.textContent=label;setTimeout(()=>button.textContent=original,900)}
    function syncLoopControls(){
      $('loopDots').replaceChildren(...Array.from({length:LOOP_LIMIT},(_,i)=>{const dot=document.createElement('span');dot.className='loop-dot'+(i<loopPoses.length?' filled':'');return dot}));
      $('previewLoop').textContent=preview?'Previewing...':'Preview';
      $('previewLoop').disabled=!!preview;$('stopPreview').disabled=!preview;
      $('addPose').disabled=!!preview||loopPoses.length>=LOOP_LIMIT;$('clearLoop').disabled=!!preview||!loopPoses.length;
    }
    // Stopping leaves the face on its current in-between frame; a finished preview settles on the first pose.
    function stopPreview(){if(!preview)return;preview=null;syncLoopControls()}
    function finishPreview(){
      const first=loopPoses[0];preview=null;applySnapshot(first);
      selected=first.hairPose;
      document.querySelectorAll('[data-pose]').forEach(button=>button.classList.toggle('active',button.dataset.pose===selected));
      mouthPose=first.mouthPose;
      document.querySelectorAll('[data-mouth-pose]').forEach(button=>button.classList.toggle('active',button.dataset.mouthPose===mouthPose));
      syncLoopControls();
    }
    function previewFrame(now){
      if(!preview)return;

    }
    $('addPose').onclick=()=>{
      if(loopPoses.length>=LOOP_LIMIT){flashLabel($('addPose'),'Full');return}
      loopPoses.push(snapshot());syncLoopControls();flashLabel($('addPose'),'Added');
    };
    $('previewLoop').onclick=()=>{
      if(loopPoses.length<2){flashLabel($('previewLoop'),'Add 2 poses');return}
      const repeats=Math.max(1,Math.min(20,Math.round(+$('previewRepeats').value)||1));
      $('previewRepeats').value=repeats;
      preview={start:performance.now(),repeats};syncLoopControls();requestAnimationFrame(previewFrame);
    };
    $('stopPreview').onclick=stopPreview;
    $('clearLoop').onclick=()=>{loopPoses.length=0;syncLoopControls()};
    $('lipColor').oninput=renderMouth;
    $('pupilColor').oninput=applyEyeControls;
    $('hairColor').oninput=()=>applyHairColor();
    $('eyeArtworkColor').oninput=()=>applyEyeArtworkColor();
    $('backgroundColor').oninput=()=>applyBackgroundColor();
    // Any hand edit in the control panels takes over from a running preview (capture runs before the control's own handler).
    for(const type of ['input','click'])$('controlsPanel').addEventListener(type,stopPreview,true);
    syncLoopControls();
    // Share GIF, as in index.html: one pass through the loop at GIF_FPS (the GIF itself repeats forever),
    // shared as a file where the browser allows it, else copied to the clipboard, else downloaded.
    // The encoder and helpers below are copied from index.html, except lzwEncode, which really compresses.
    const GIF_REPEAT_FOREVER=0;
    function writeLittleEndian16(bytes, value) {
      bytes.push(value & 0xff, (value >> 8) & 0xff);
    }

    function writeAscii(bytes, text) {
      for (let index = 0; index < text.length; index += 1) {
        bytes.push(text.charCodeAt(index));
      }
    }

    function nearestPaletteIndex(r, g, b, palette, cache, startIndex = 0) {
      const key = `${r >> 3},${g >> 3},${b >> 3}`;
      if (cache.has(key)) return cache.get(key);

      let bestIndex = startIndex;
      let bestDistance = Infinity;
      for (let index = startIndex; index < palette.length; index += 1) {
        const color = palette[index];
        const dr = r - color[0];
        const dg = g - color[1];
        const db = b - color[2];
        const distance = dr * dr + dg * dg + db * db;
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      }
      cache.set(key, bestIndex);
      return bestIndex;
    }

    function buildGifPaletteFromPixels(pixels, maxColors = 128) {
      if (pixels.length === 0) return Array.from({ length: maxColors }, () => [0, 0, 0]);

      const colorRange = (colors, channel) => {
        let min = 255;
        let max = 0;
        colors.forEach((color) => {
          min = Math.min(min, color[channel]);
          max = Math.max(max, color[channel]);
        });
        return max - min;
      };

      const boxes = [pixels];
      while (boxes.length < maxColors) {
        boxes.sort((a, b) => {
          const aRange = Math.max(colorRange(a, 0), colorRange(a, 1), colorRange(a, 2));
          const bRange = Math.max(colorRange(b, 0), colorRange(b, 1), colorRange(b, 2));
          return bRange - aRange;
        });

        if (!box || box.length <= 1) {
          if (box) boxes.push(box);

        }

        const channel = channelRanges.indexOf(Math.max(...channelRanges));

        boxes.push(box.slice(0, midpoint), box.slice(midpoint));
      }

      const palette = boxes.map((box) => {
        const total = box.reduce((sum, color) => {
          sum[0] += color[0];
          sum[1] += color[1];
          sum[2] += color[2];
          return sum;
        }, [0, 0, 0]);
        const count = Math.max(1, box.length);
        return total.map((value) => Math.round(value / count));

      while (palette.length < maxColors) palette.push([0, 0, 0]);
      return palette.slice(0, maxColors);
    }

    function buildGifPaletteFromFrames(frames, maxColors = 128) {
      const pixels = [];
      frames.forEach((imageData, frameIndex) => {
        const data = imageData.data;
        const stride = frameIndex % 3 === 0 ? 16 : 64;
        for (let index = 0; index < data.length; index += stride) {
          if (data[index + 3] < 128) continue;
          pixels.push([data[index], data[index + 1], data[index + 2]]);
        }
      });
      return [[0, 255, 0], ...buildGifPaletteFromPixels(pixels, maxColors - 1)];
    }

    function indexedPixelsFromImageData(imageData, palette, transparentIndex = 0) {
      const data = imageData.data;
      const indexed = new Uint8Array(imageData.width * imageData.height);
      const cache = new Map();
      for (let source = 0, target = 0; source < data.length; source += 4, target += 1) {
        if (data[source + 3] < 128) {
          indexed[target] = transparentIndex;
        } else {
          indexed[target] = nearestPaletteIndex(data[source], data[source + 1], data[source + 2], palette, cache, 1);
        }
      }
      return indexed;
    }

    // Dictionary LZW (replaces index.html's version, which wrote every pixel as its own code). Each new
    // string is keyed by (prefix code << 8 | next index); codes widen up to 12 bits, and a full table is
    // reset with a clear code, matching how GIF decoders rebuild the same table.
    function lzwEncode(indices, minCodeSize) {
      const clearCode = 1 << minCodeSize;
      const endCode = clearCode + 1;
      let codeSize = minCodeSize + 1;
      let nextCode = endCode + 1;
      let bitBuffer = 0;
      let bitCount = 0;
      const output = [];
      const table = new Map();

      const writeCode = (code) => {
        bitBuffer |= code << bitCount;
        bitCount += codeSize;
        while (bitCount >= 8) {
          output.push(bitBuffer & 0xff);
          bitBuffer >>= 8;
          bitCount -= 8;
        }
      };

      writeCode(clearCode);
      let prefix = indices[0];
      for (let index = 1; index < indices.length; index += 1) {
        const pixel = indices[index];
        const key = (prefix << 8) | pixel;
        const code = table.get(key);
        if (code !== undefined) {
          prefix = code;
          continue;
        }
        writeCode(prefix);
        if (nextCode === 4096) {
          writeCode(clearCode);
          table.clear();
          codeSize = minCodeSize + 1;
          nextCode = endCode + 1;
        } else {
          if (nextCode >= 1 << codeSize) codeSize += 1;
          table.set(key, nextCode);
          nextCode += 1;
        }

      }

      writeCode(prefix);
      writeCode(endCode);
      if (bitCount > 0) output.push(bitBuffer & 0xff);
      return output;
    }

    function writeGifSubBlocks(bytes, data) {
      for (let index = 0; index < data.length; index += 255) {
        const block = data.slice(index, index + 255);
        bytes.push(block.length, ...block);
      }

    }

    function writeGifLoopExtension(bytes, repeatCount = 0) {
      bytes.push(0x21, 0xff, 0x0b);
      writeAscii(bytes, "NETSCAPE2.0");
      bytes.push(0x03, 0x01);
      writeLittleEndian16(bytes, repeatCount);
      bytes.push(0x00);
    }

    function encodeGif(frames, width, height, delayMs, repeatCount = GIF_REPEAT_FOREVER) {
      const bytes = [];
      const paletteSize = 128;
      const minCodeSize = 7;
      const colorTableSizeFlag = Math.log2(paletteSize) - 1;
      const palette = buildGifPaletteFromFrames(frames, paletteSize);

      writeAscii(bytes, "GIF89a");
      writeLittleEndian16(bytes, width);
      writeLittleEndian16(bytes, height);
      bytes.push(0x80 | 0x70 | colorTableSizeFlag, 0, 0);
      palette.forEach((color) => bytes.push(color[0], color[1], color[2]));

      // Netscape repeat count 0 means replay forever.
      writeGifLoopExtension(bytes, repeatCount);

      frames.forEach((imageData) => {
        const indexedPixels = indexedPixelsFromImageData(imageData, palette, 0);
        const compressedPixels = lzwEncode(indexedPixels, minCodeSize);

        bytes.push(0x21, 0xf9, 0x04, 0x09);
        writeLittleEndian16(bytes, Math.max(2, Math.round(delayMs / 10)));
        bytes.push(0, 0);

        bytes.push(0x2c);
        writeLittleEndian16(bytes, 0);
        writeLittleEndian16(bytes, 0);
        writeLittleEndian16(bytes, width);
        writeLittleEndian16(bytes, height);
        bytes.push(0);

        bytes.push(minCodeSize);
        writeGifSubBlocks(bytes, compressedPixels);
      });

      bytes.push(0x3b);
      return new Blob([new Uint8Array(bytes)], { type: "image/gif" });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function copyGifToClipboard(blob) {
      if (!navigator.clipboard?.write || typeof ClipboardItem === "undefined") return false;

        await navigator.clipboard.write([new ClipboardItem({ "image/gif": blob })]);
        return true;
      } catch (error) {
        return false;
      }
    }

    const GIF_SIZE=300,GIF_FPS=12;
    let cachedGif=null;
    // Rasterize the stage SVG (it carries its own defs, so it renders standalone) onto the GIF canvas.
    async function drawStageFrame(ctx){
      const clone=$('stage').cloneNode(true);clone.querySelector('#loading')?.remove();
      clone.setAttribute('xmlns',NS);clone.setAttribute('width',GIF_SIZE);clone.setAttribute('height',GIF_SIZE);
      const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'})),image=new Image();

    }
    async function buildLoopGifBlob(){

      canvas.width=canvas.height=GIF_SIZE;gifBuilding=true;

        const n=loopPoses.length,frameCount=Math.ceil(PHASE_MS*n/1000*GIF_FPS);

      }finally{gifBuilding=false;applySnapshot(original)}
    }
    async function shareLoopGif(){
      const button=$('shareGif');

      stopPreview();

      button.disabled=true;button.textContent='Making GIF...';

        const blob=await buildLoopGifBlob(),filename=`clown-face-${loopPoses.length}-poses.gif`,file=new File([blob],filename,{type:'image/gif'});

          try{await navigator.share({files:[file]});return}

            if(error.name==='AbortError')return;

        button.disabled=false;button.textContent=label;

      }
    }
    $('shareGif').onclick=shareLoopGif;
    $('export').onclick=()=>{
      const clone=$('stage').cloneNode(true);clone.querySelector('#loading')?.remove();clone.setAttribute('xmlns',NS);
      const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='clown-face.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);

    selectMouthPose('Smile',false);
    applyBrowControls();
    init();
  </script>
